name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --no-self-update
          rustup default 1.93.1
          rustup target add '${{ matrix.target }}'
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked --target '${{ matrix.target }}'
      - name: Build both executables
        run: cargo build --release --locked --bins --target '${{ matrix.target }}'
      - name: Package and verify
        run: python .github/scripts/package_release.py '${{ matrix.target }}'
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: mmf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
